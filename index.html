<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Медитация и Осознанность</title>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --accent-color: #7d9d85;
            --accent-hover: #67846e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #7a7a7a;
        }

        .audio-player {
            width: 100%;
            margin-bottom: 30px;
        }

        audio {
            width: 100%;
            border-radius: 30px;
        }

        .tg-button {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(125, 157, 133, 0.3);
        }

        .tg-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .tg-button:active {
            transform: translateY(0);
        }

        .subtext {
            font-size: 13px;
            margin-top: 15px;
            color: #9b9b9b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Иконка/Логотип -->
        <div class="icon">🧘‍♀️</div>
        
        <!-- Заголовок и описание -->
        <h1>Островок спокойствия</h1>
        <p>Сделайте глубокий вдох, расслабьтесь и послушайте приветственную аудиопрактику ниже.</p>
        
        <!-- Аудио плеер -->
        <div class="audio-player">
            <!-- Замените "audio.mp3" на ссылку на ваш аудиофайл -->
            <audio controls>
                <source src="audio.mp3" type="audio/mpeg">
                Ваш браузер не поддерживает воспроизведение аудио.
            </audio>
        </div>

        <!-- Кнопка Telegram -->
        <!-- Замените "https://t.me" на ссылку на ваш канал -->
        <a href="https://t.me" class="tg-button" target="_blank">
            Слушать медитации в Telegram
        </a>
        
        <!-- Подпись под кнопкой -->
        <div class="subtext">
        </div>
    </div>

</body>
</html>
